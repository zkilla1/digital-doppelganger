# gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=us-east1
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "$_REGION-docker.pkg.dev/$PROJECT_ID/doppelganger/app:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/doppelganger/app:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - doppelganger
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/doppelganger/app:$SHORT_SHA
      - --region=$_REGION
      - --allow-unauthenticated
      - --set-secrets=OPENAI_API_KEY=openai-api-key:latest
substitutions:
  _REGION: us-east1
